<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>נופית חוגגת 39 - מפה ותוכנייה אינטראקטיבית</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <!-- Google Fonts - Rubik -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Rubik', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #d8ecf8;
      color: #2c3e50;
      touch-action: none;
    }

    #app-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* Map Viewport */
    #map {
      width: 100%;
      height: 100%;
      background: #e6f2f9;
      z-index: 1;
    }

    /* Top Floating Header Banner */
    .top-banner {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 8px 12px;
      box-shadow: 0 4px 22px rgba(0, 0, 0, 0.14);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border: 1px solid rgba(255, 255, 255, 0.9);
      animation: slideDown 0.4s ease-out;
    }

    @keyframes slideDown {
      from { transform: translateY(-30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .banner-left-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .banner-title {
      font-size: 14.5px;
      font-weight: 800;
      color: #1b4332;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .pulse-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #e63946;
      border-radius: 50%;
      box-shadow: 0 0 0 rgba(230, 57, 70, 0.5);
      animation: livePulse 1.6s infinite;
    }

    @keyframes livePulse {
      0% { box-shadow: 0 0 0 0 rgba(230, 57, 70, 0.7); }
      70% { box-shadow: 0 0 0 7px rgba(230, 57, 70, 0); }
      100% { box-shadow: 0 0 0 0 rgba(230, 57, 70, 0); }
    }

    /* Segmented Switcher (Map vs Brochure) */
    .view-switch-container {
      display: flex;
      background: #e5e9ec;
      border-radius: 22px;
      padding: 3px;
      gap: 3px;
    }

    .view-switch-btn {
      border: none;
      background: transparent;
      padding: 6px 12px;
      border-radius: 18px;
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      color: #555e68;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      gap: 5px;
      user-select: none;
    }

    .view-switch-btn.active {
      background: #ffffff;
      color: #1b4332;
      box-shadow: 0 2px 7px rgba(0, 0, 0, 0.12);
    }

    .btn-list-toggle {
      background: #2d6a4f;
      color: #ffffff;
      border: none;
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 12.5px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 2px 7px rgba(45, 106, 79, 0.25);
      transition: transform 0.15s, background-color 0.15s;
      white-space: nowrap;
    }

    .btn-list-toggle:active {
      transform: scale(0.95);
      background: #1b4332;
    }

    /* Hint toast in Brochure mode */
    .brochure-hint {
      position: absolute;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      background: rgba(27, 67, 50, 0.9);
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      pointer-events: none;
      backdrop-filter: blur(4px);
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
      display: none;
      animation: fadeIn 0.3s;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translate(-50%, -6px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }

    /* Custom Leaflet Pulsing Markers */
    .station-marker-wrap {
      width: 52px;
      height: 52px;
      cursor: pointer;
      position: relative;
    }

    .pulse-outer {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 48px;
      height: 48px;
      margin-top: -24px;
      margin-left: -24px;
      border-radius: 50%;
      background: rgba(255, 183, 3, 0.4);
      border: 2px solid #ffb703;
      animation: markerPulse 1.8s ease-out infinite;
      pointer-events: none;
    }

    .pulse-outer.has-yt {
      background: rgba(230, 57, 70, 0.35);
      border-color: #e63946;
    }

    @keyframes markerPulse {
      0% { transform: scale(0.6); opacity: 0.95; }
      70% { transform: scale(1.35); opacity: 0.1; }
      100% { transform: scale(1.5); opacity: 0; }
    }

    .marker-bubble {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 34px;
      height: 34px;
      margin-top: -17px;
      margin-left: -17px;
      background: linear-gradient(135deg, #ffd166 0%, #ffb703 100%);
      border: 2.5px solid #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .marker-bubble.has-yt {
      background: linear-gradient(135deg, #ff4d6d 0%, #d90429 100%);
    }

    .marker-bubble svg {
      width: 18px;
      height: 18px;
      fill: #ffffff;
    }

    .station-marker-wrap:hover .marker-bubble,
    .station-marker-wrap:active .marker-bubble {
      transform: scale(1.25);
    }

    /* Floating Navigation Tools */
    .floating-tools {
      position: absolute;
      bottom: 24px;
      left: 16px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .tool-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
      font-size: 19px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s, background-color 0.15s;
    }

    .tool-btn:active {
      transform: scale(0.92);
      background: #f1f3f5;
    }

    /* Mobile Bottom Sheet Modal */
    .bottom-sheet {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: #ffffff;
      border-radius: 26px 26px 0 0;
      padding: 14px 20px 24px;
      box-shadow: 0 -8px 36px rgba(0, 0, 0, 0.25);
      z-index: 1500;
      transform: translateY(115%);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      border-top: 1px solid rgba(0, 0, 0, 0.06);
      max-width: 520px;
      margin: 0 auto;
    }

    .bottom-sheet.open {
      transform: translateY(0);
    }

    .sheet-handle-bar {
      width: 40px;
      height: 4.5px;
      background: #d1d5db;
      border-radius: 10px;
      margin: 0 auto 12px;
    }

    .sheet-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .sheet-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #e8f5e9;
      color: #2d6a4f;
      font-size: 11.5px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 12px;
      margin-bottom: 4px;
    }

    .sheet-title {
      font-size: 22px;
      font-weight: 800;
      color: #111827;
      line-height: 1.25;
    }

    .btn-close-sheet {
      background: #f3f4f6;
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 17px;
      color: #4b5563;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    .btn-close-sheet:active {
      background: #e5e7eb;
    }

    .sheet-info-rows {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin: 10px 0 16px;
      font-size: 14px;
      color: #374151;
    }

    .info-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .info-icon {
      font-size: 16px;
      width: 22px;
      text-align: center;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .sheet-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
    }

    .media-buttons-row {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .btn-media-action {
      flex: 1;
      text-decoration: none;
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 14.5px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #ffffff;
      transition: transform 0.15s, background-color 0.15s;
      white-space: nowrap;
    }

    .btn-media-action:active {
      transform: scale(0.97);
    }

    .btn-media-action svg {
      width: 20px;
      height: 20px;
      fill: #ffffff;
      flex-shrink: 0;
    }

    .btn-youtube-action {
      background: #ff0000;
      box-shadow: 0 4px 12px rgba(255, 0, 0, 0.3);
    }

    .btn-youtube-action:active {
      background: #d90000;
    }

    .btn-spotify-action {
      background: #1db954;
      box-shadow: 0 4px 12px rgba(29, 185, 84, 0.3);
    }

    .btn-spotify-action:active {
      background: #179843;
    }

    .btn-recenter-action {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 9px 12px;
      font-size: 13px;
      font-weight: 600;
      color: #4b5563;
      cursor: pointer;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      width: 100%;
      transition: background 0.15s;
    }

    .btn-recenter-action:active {
      background: #f3f4f6;
    }

    .pulse-outer.is-green {
      background: rgba(16, 185, 129, 0.35);
      border-color: #10b981;
    }

    .marker-bubble.is-green {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    }

    .sheet-badge.is-green {
      background: #d1fae5;
      color: #065f46;
    }

    .btn-green-action {
      flex: 1;
      background: #059669;
      box-shadow: 0 4px 12px rgba(5, 150, 105, 0.3);
      color: #ffffff;
      text-decoration: none;
      border-radius: 14px;
      padding: 11px 14px;
      font-size: 13.5px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.15s, background-color 0.15s;
      width: 100%;
    }

    .btn-green-action:active {
      background: #047857;
      transform: scale(0.97);
    }

    .tag-green-active {
      background: #d1fae5;
      color: #065f46;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 7px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 3px;
      white-space: nowrap;
    }

    .modal-section-title {
      font-size: 14.5px;
      font-weight: 800;
      color: #1b4332;
      margin: 16px 4px 10px;
      padding-bottom: 4px;
      border-bottom: 2px solid #e5e7eb;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tags-container {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .tag-spotify-active {
      background: #d1fae5;
      color: #065f46;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 7px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 3px;
      white-space: nowrap;
    }

    .tag-spotify-active svg {
      width: 12px;
      height: 12px;
      fill: #065f46;
    }

    /* All Stations Modal Drawer */
    .stations-modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 2000;
      display: none;
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      align-items: flex-end;
    }

    .stations-modal-overlay.open {
      display: flex;
    }

    .stations-modal {
      width: 100%;
      max-height: 82vh;
      background: #ffffff;
      border-radius: 26px 26px 0 0;
      padding: 20px;
      overflow-y: auto;
      max-width: 520px;
      margin: 0 auto;
      animation: slideUp 0.28s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #f3f4f6;
    }

    .modal-head h3 {
      font-size: 19px;
      font-weight: 800;
      color: #1b4332;
    }

    .station-list-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-radius: 14px;
      background: #f9fafb;
      border: 1px solid #f3f4f6;
      margin-bottom: 10px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .station-list-row:active {
      background: #ecfdf5;
      border-color: #a7f3d0;
    }

    .station-item-main h4 {
      font-size: 15.5px;
      font-weight: 700;
      color: #111827;
    }

    .station-item-main p {
      font-size: 12px;
      color: #6b7280;
      margin-top: 2px;
    }

    .tag-yt-active {
      background: #fee2e2;
      color: #b91c1c;
      font-size: 11.5px;
      font-weight: 700;
      padding: 5px 9px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .tag-yt-pending {
      background: #f3f4f6;
      color: #6b7280;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 8px;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="app-container">
    
    <!-- Top Floating Header -->
    <div class="top-banner">
      <div class="banner-left-group">
        <div class="banner-title">
          <span class="pulse-dot"></span>
          נופית חוגגת 39
        </div>

        <!-- Segmented View Switcher: Map vs Brochure -->
        <div class="view-switch-container">
          <button class="view-switch-btn active" id="btnSwitchMap">
            <span>🗺️</span> מפה
          </button>
          <button class="view-switch-btn" id="btnSwitchBrochure">
            <span>📄</span> תוכנייה
          </button>
        </div>
      </div>

      <button class="btn-list-toggle" id="btnOpenList">
        <span>🎵</span> הרכבים ופעילויות 🌿
      </button>
    </div>

    <!-- Brochure Zoom Hint -->
    <div class="brochure-hint" id="brochureHint">
      🔍 ניתן להגדיל ולנווט בתוכנייה (Pinch-to-zoom)
    </div>

    <!-- Leaflet Canvas -->
    <div id="map"></div>

    <!-- Floating Navigation Tools -->
    <div class="floating-tools">
      <button class="tool-btn" id="btnResetView" title="מרכז מבט מלא">🔄</button>
      <button class="tool-btn" id="btnZoomIn" title="התקרב">➕</button>
      <button class="tool-btn" id="btnZoomOut" title="התרחק">➖</button>
    </div>

    <!-- Bottom Sheet Card for Selected Station -->
    <div class="bottom-sheet" id="bottomSheet">
      <div class="sheet-handle-bar"></div>
      <div class="sheet-top">
        <div>
          <div class="sheet-badge" id="sheetBadge">
            <span>🎤</span> תחנה מוסיקלית
          </div>
          <h2 class="sheet-title" id="sheetTitle">שם התחנה</h2>
        </div>
        <button class="btn-close-sheet" id="btnCloseSheet">✕</button>
      </div>

      <div class="sheet-info-rows">
        <div class="info-row">
          <span class="info-icon">📍</span>
          <span id="sheetLocation">מיקום במסלול</span>
        </div>
        <div class="info-row" id="sheetLineupRow">
          <span class="info-icon" id="sheetLineupIcon">👥</span>
          <span id="sheetLineup">הרכב ונגנים</span>
        </div>
        <div class="info-row" id="sheetTimeRow">
          <span class="info-icon">⏰</span>
          <span id="sheetTime">שעות</span>
        </div>
        <div class="info-row">
          <span class="info-icon">ℹ️</span>
          <span id="sheetDesc">תיאור וסגנון</span>
        </div>
      </div>

      <div class="sheet-actions">
        <div class="media-buttons-row" id="musicalActionsRow">
          <a href="#" target="_blank" rel="noopener noreferrer" class="btn-media-action btn-youtube-action" id="sheetYtBtn">
            <svg viewBox="0 0 24 24">
              <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
            </svg>
            <span id="sheetYtText">YouTube</span>
          </a>
          <a href="#" target="_blank" rel="noopener noreferrer" class="btn-media-action btn-spotify-action" id="sheetSpotifyBtn">
            <svg viewBox="0 0 24 24">
              <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.495 17.306c-.215.352-.676.463-1.028.247-2.817-1.722-6.363-2.112-10.54-1.157-.402.092-.801-.161-.893-.563-.092-.402.161-.801.563-.893 4.576-1.045 8.492-.596 11.65 1.338.353.216.464.676.248 1.028zm1.467-3.262c-.27.44-.847.578-1.287.308-3.225-1.982-8.14-2.557-11.954-1.399-.494.15-1.02-.133-1.17-.627-.15-.494.133-1.02.627-1.17 4.364-1.324 9.791-.685 13.476 1.58.44.27.578.847.308 1.288zm.126-3.41c-3.868-2.296-10.248-2.508-13.941-1.387-.593.18-1.223-.155-1.403-.748-.18-.593.155-1.223.748-1.403 4.25-1.29 11.295-1.039 15.753 1.608.533.316.708 1.008.392 1.541-.316.533-1.008.708-1.549.39z"/>
            </svg>
            <span>Spotify</span>
          </a>
        </div>
        <div class="media-buttons-row" id="greenActionsRow" style="display: none; flex-direction: column; gap: 6px;">
        </div>
        <button class="btn-recenter-action" id="sheetZoomBtn">🔍 התמקד במפה</button>
      </div>
    </div>

    <!-- Stations List Modal -->
    <div class="stations-modal-overlay" id="stationsModalOverlay">
      <div class="stations-modal">
        <div class="modal-head">
          <h3>🌲 הרכבים מוסיקליים ופעילויות סביבתיות</h3>
          <button class="btn-close-sheet" id="btnCloseListModal">✕</button>
        </div>
        <div id="stationsListContainer">
          <!-- Dynamically filled -->
        </div>
      </div>
    </div>

  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <script>
    // --- 1. Dimensions & Bounds ---
    // Map Image: 1264w x 898h
    const MAP_W = 1264;
    const MAP_H = 898;
    const boundsMap = [[0, 0], [MAP_H, MAP_W]];
    const maxBoundsMap = [[-150, -150], [MAP_H + 150, MAP_W + 150]];

    // Brochure Image: 898w x 1264h
    const BROCHURE_W = 898;
    const BROCHURE_H = 1264;
    const boundsBrochure = [[0, 0], [BROCHURE_H, BROCHURE_W]];
    const maxBoundsBrochure = [[-150, -150], [BROCHURE_H + 150, BROCHURE_W + 150]];

    // --- 2. Station Data with Brochure details & YouTube channels ---
    const STATIONS = [
      {
        id: "templar",
        name: "Templar",
        x: 402,
        y: 130,
        location: "צפון המסלול, סמוך לספסל צמיגים",
        lineup: "תומר אלמלח (גיטרה), שיילה לייאר (חצוצרה)",
        time: "החל מ-10:30",
        description: "דואו פלמנקו - ג'אז עכשווי סוחף ומיוחד",

      {

        spotify: "https://open.spotify.com/artist/5oVL5BRMnqEicvj8gqbgGg?si=GS9iOv_YS7SLBbSN_1050g&utm_source=copy-link",

      },
      {

        lineup: "נועה בן שושן (שירה), עידן טולדנו (גיטרה ועוד), אורי דקל (כלי הקשה)",
        time: "החל מ-10:30",
        description: "מוסיקה מרוקאית, צפון אפריקאית ואנדלוסית בעיבודים עכשוויים",
        youtube: "https://www.youtube.com/@marrakeshexpress-5748",
        spotify: "https://open.spotify.com/artist/7ImcLF2hrB3Fm46Mqvo3iB?si=DcaEGZtTR-O6AAB7e6RmOQ&utm_source=copy-link",
        hasOfficialYt: true
      },
      {
        id: "daniel_rubin",
        name: "דניאל רובין",
        x: 565,
        y: 128,
        location: "צפון המסלול, ליד מצפור חיפושיות ורחוב הגליל",
        lineup: "דניאל רובין",
        time: "החל מ-10:30",
        description: "זמרת ויוצרת ישראלית, שירים מקוריים מרגשים",
        youtube: "https://www.youtube.com/channel/UCZ824A30sE44oDpokVhiGTw",
        spotify: "https://open.spotify.com/artist/077agqIDRCxkgjNgA0v1pB?si=ziWamJjUSXepO4tjn4GtWQ&utm_source=copy-link",
        hasOfficialYt: true
      },
      {
        id: "celtic",
        name: "נבל וקלרינט",
        x: 195,
        y: 119,
        location: "צפון-מערב המסלול, ליד כלי טחינה עתיקים",
        lineup: "רז כרם (נבל), אלעד שפע (קלרינט ואקורדיון)",
        time: "החל מ-10:30",
        description: "צלילי נבל וקלרינט באווירה פסטורלית קסומה",
        youtube: "https://youtu.be/W0RzZGvHDEE?si=APqBW8JY9G6fWQ89",
        spotify: null,
        hasOfficialYt: true
      },
      {
        id: "ruach_yam",
        name: "רוח ים",
        x: 756,
        y: 147,
        location: "מזרח המסלול, סמוך לכניסה הראשית",
        lineup: "שירי ניצני קריסטל (חליל), אולגה מויטליס (נבל)",
        time: "החל מ-10:30",
        description: "אווירה ייחודית וקסומה בצלילי חליל ונבל",
        youtube: "https://youtu.be/w-dpLI3Rg0I?si=6alxc2F4apkI6l--",
        spotify: null,
        hasOfficialYt: true
      }
    ];

    // --- 3. Green Environmental Points ---
    const GREEN_POINTS = [
      {
        id: "green_tzipori",
        name: "חנוכת מבואת נחל ציפורי",
        type: "green",
        x: 284,
        y: 107,
        location: "צפון-מערב השביל, סמוך לכלי טחינה עתיקים",
        org: "רשות ניקוז ונחלים קישון",
        time: "פעילות לאורך כל האירוע",
        description: "חנוכת מבואת נחל ציפורי בנופית: סדנאות יצירה של מלאכות מסורתיות עם חימר וצמר, והסבר לגבי המבואה ותהליך התכנון.",
        links: [
          { name: "רשות ניקוז ונחלים קישון", url: "https://www.rnkishon.co.il" }
        ]
      },
      {
        id: "green_pine_bench",
        name: "נחל הקישון, צפרות ויצירה מהטבע",
        type: "green",
        x: 136,
        y: 348,
        location: "מערב השביל, סמוך לספסל האורן וחלון לנוף",
        org: "רשות נחל הקישון & החברה להגנת הטבע",
        time: "פעילות לאורך כל האירוע",
        description: "היכרות עם נחל הקישון והמגוון הביולוגי, עמדת מגדירי ציפורים ומשקפות לצפייה בנוף, וסדנאות יצירה וציור מחומרים מן הטבע.",
        links: [
          { name: "רשות נחל הקישון", url: "https://kishon.org.il" },
          { name: "החברה להגנת הטבע", url: "https://www.teva.org.il" }
        ]
      },
      {
        id: "green_sundial",
        name: "היכרות עם הנשרים",
        type: "green",
        x: 269,
        y: 436,
        location: "מערב השביל, סמוך לשעון שמש",
        org: "רשות הטבע והגנים",
        time: "פעילות לאורך כל האירוע",
        description: "היכרות מרתקת עם עולם הנשרים, עופות דורסים ומאמצי השימור וההגנה על חיות הבר של רשות הטבע והגנים.",
        links: [
          { name: "רשות הטבע והגנים", url: "https://www.parks.org.il" }
        ]
      }
    ];

    // --- 4. Initialize Leaflet Map ---
    let currentViewMode = 'map'; // 'map' or 'brochure'

    const map = L.map('map', {
      crs: L.CRS.Simple,
      minZoom: -2.8,
      maxZoom: 2.2,
      zoomSnap: 0.1,
      zoomDelta: 0.4,
      maxBounds: maxBoundsMap,
      maxBoundsViscosity: 0.8,
      attributionControl: false,
      zoomControl: false,
      bounceAtZoomLimits: true
    });

    // Image Overlays
    const mapOverlay = L.imageOverlay('IMG-20261108-WA0016.jpg', boundsMap).addTo(map);
    const brochureOverlay = L.imageOverlay('IMG-20261108-WA0018.jpg', boundsBrochure);

    // Initial View
    map.fitBounds(boundsMap, { padding: [10, 10] });

    // Markers Layer Group
    const markersLayer = L.layerGroup().addTo(map);

    function pixelToLatLng(x, y) {
      return L.latLng(MAP_H - y, x);
    }

    // SVG Icons for markers
    const ytPlaySvg = `
      <svg viewBox="0 0 24 24">
        <path d="M8 5v14l11-7z"/>
      </svg>
    `;
    const micSvg = `
      <svg viewBox="0 0 24 24">
        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
      </svg>
    `;
    const recycleSvg = `
      <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 19H3v-4"/>
        <path d="M3 19l4.5-4.5"/>
        <path d="M17 5h4v4"/>
        <path d="M21 5l-4.5 4.5"/>
        <path d="M12 21a9 9 0 0 0 7.8-4.5"/>
        <path d="M12 3a9 9 0 0 0-7.8 4.5"/>
      </svg>
    `;

    // Populate Musical Markers
    STATIONS.forEach(station => {
      const latlng = pixelToLatLng(station.x, station.y);
      const isYt = station.hasOfficialYt;

      const markerHtml = `
        <div class="station-marker-wrap">
          <div class="pulse-outer ${isYt ? 'has-yt' : ''}"></div>
          <div class="marker-bubble ${isYt ? 'has-yt' : ''}" title="${station.name}">
            ${isYt ? ytPlaySvg : micSvg}
          </div>
        </div>
      `;

      const customIcon = L.divIcon({
        className: 'custom-station-icon',
        html: markerHtml,
        iconSize: [52, 52],
        iconAnchor: [26, 26]
      });

      const marker = L.marker(latlng, { icon: customIcon });

      marker.on('click', (e) => {
        L.DomEvent.stopPropagation(e);
        openStationSheet(station);
      });

      markersLayer.addLayer(marker);
    });

    // Populate Green Environmental Markers
    GREEN_POINTS.forEach(point => {
      const latlng = pixelToLatLng(point.x, point.y);

      const markerHtml = `
        <div class="station-marker-wrap">
          <div class="pulse-outer is-green"></div>
          <div class="marker-bubble is-green" title="${point.name}">
            ${recycleSvg}
          </div>
        </div>
      `;

      const customIcon = L.divIcon({
        className: 'custom-station-icon',
        html: markerHtml,
        iconSize: [52, 52],
        iconAnchor: [26, 26]
      });

      const marker = L.marker(latlng, { icon: customIcon });

      marker.on('click', (e) => {
        L.DomEvent.stopPropagation(e);
        openGreenSheet(point);
      });

      markersLayer.addLayer(marker);
    });

    // --- 5. Switch Between Map and Brochure ---
    const btnSwitchMap = document.getElementById('btnSwitchMap');
    const btnSwitchBrochure = document.getElementById('btnSwitchBrochure');
    const brochureHint = document.getElementById('brochureHint');

    function switchToMap() {
      if (currentViewMode === 'map') return;
      currentViewMode = 'map';

      btnSwitchMap.classList.add('active');
      btnSwitchBrochure.classList.remove('active');
      brochureHint.style.display = 'none';

      map.removeLayer(brochureOverlay);
      mapOverlay.addTo(map);
      markersLayer.addTo(map);

      map.setMaxBounds(maxBoundsMap);
      map.fitBounds(boundsMap, { padding: [10, 10], duration: 0.45 });
    }

    function switchToBrochure() {
      if (currentViewMode === 'brochure') return;
      currentViewMode = 'brochure';

      btnSwitchBrochure.classList.add('active');
      btnSwitchMap.classList.remove('active');
      closeStationSheet();

      map.removeLayer(mapOverlay);
      map.removeLayer(markersLayer);
      brochureOverlay.addTo(map);

      map.setMaxBounds(maxBoundsBrochure);
      map.fitBounds(boundsBrochure, { padding: [10, 10], duration: 0.45 });

      // Show brief hint
      brochureHint.style.display = 'block';
      setTimeout(() => {
        brochureHint.style.display = 'none';
      }, 3500);
    }

    btnSwitchMap.addEventListener('click', switchToMap);
    btnSwitchBrochure.addEventListener('click', switchToBrochure);

    // --- 6. Bottom Sheet Details ---
    const bottomSheet = document.getElementById('bottomSheet');
    const sheetBadge = document.getElementById('sheetBadge');
    const sheetTitle = document.getElementById('sheetTitle');
    const sheetLocation = document.getElementById('sheetLocation');
    const sheetLineupRow = document.getElementById('sheetLineupRow');
    const sheetLineupIcon = document.getElementById('sheetLineupIcon');
    const sheetLineup = document.getElementById('sheetLineup');
    const sheetTimeRow = document.getElementById('sheetTimeRow');
    const sheetTime = document.getElementById('sheetTime');
    const sheetDesc = document.getElementById('sheetDesc');
    const musicalActionsRow = document.getElementById('musicalActionsRow');
    const greenActionsRow = document.getElementById('greenActionsRow');
    const sheetYtBtn = document.getElementById('sheetYtBtn');
    const sheetYtText = document.getElementById('sheetYtText');
    const sheetSpotifyBtn = document.getElementById('sheetSpotifyBtn');
    const sheetZoomBtn = document.getElementById('sheetZoomBtn');
    const btnCloseSheet = document.getElementById('btnCloseSheet');
    let selectedStation = null;

    function openStationSheet(station) {
      selectedStation = station;
      sheetBadge.innerHTML = "<span>🎤</span> תחנה מוסיקלית";
      sheetBadge.className = "sheet-badge";

      sheetTitle.textContent = station.name;
      sheetLocation.textContent = station.location;
      sheetLineupIcon.textContent = "👥";
      sheetLineup.textContent = station.lineup;
      sheetTimeRow.style.display = 'flex';
      sheetTime.textContent = station.time;
      sheetDesc.textContent = station.description;

      musicalActionsRow.style.display = 'flex';
      greenActionsRow.style.display = 'none';

      sheetYtBtn.href = station.youtube;
      sheetYtText.textContent = "YouTube ▶";

      if (station.spotify) {
        sheetSpotifyBtn.href = station.spotify;
        sheetSpotifyBtn.style.display = 'flex';
      } else {
        sheetSpotifyBtn.style.display = 'none';
      }

      bottomSheet.classList.add('open');

      if (currentViewMode === 'map') {
        const targetLatLng = pixelToLatLng(station.x, station.y);
        const offsetLat = targetLatLng.lat - (window.innerWidth < 600 ? 70 : 30);
        map.flyTo([offsetLat, targetLatLng.lng], Math.max(map.getZoom(), 0.1), { duration: 0.5 });
      }
    }

    function openGreenSheet(point) {
      selectedStation = point;
      sheetBadge.innerHTML = "<span>🌿</span> נקודה ירוקה - פעילות סביבתית";
      sheetBadge.className = "sheet-badge is-green";

      sheetTitle.textContent = point.name;
      sheetLocation.textContent = point.location;
      sheetLineupIcon.textContent = "🏛️";
      sheetLineup.textContent = point.org;
      sheetTimeRow.style.display = 'flex';
      sheetTime.textContent = point.time;
      sheetDesc.textContent = point.description;

      musicalActionsRow.style.display = 'none';
      greenActionsRow.style.display = 'flex';

        <a href="${link.url}" target="_blank" rel="noopener noreferrer" class="btn-green-action">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
          <span>לאתר ${link.name} ↗</span>
        </a>
      `).join('');

      bottomSheet.classList.add('open');

      if (currentViewMode === 'map') {
        const targetLatLng = pixelToLatLng(point.x, point.y);
        const offsetLat = targetLatLng.lat - (window.innerWidth < 600 ? 70 : 30);
        map.flyTo([offsetLat, targetLatLng.lng], Math.max(map.getZoom(), 0.1), { duration: 0.5 });
      }
    }

    function closeStationSheet() {
      bottomSheet.classList.remove('open');
      selectedStation = null;
    }

    btnCloseSheet.addEventListener('click', closeStationSheet);

    sheetZoomBtn.addEventListener('click', () => {
      if (selectedStation && currentViewMode === 'map') {
        const targetLatLng = pixelToLatLng(selectedStation.x, selectedStation.y);
        const offsetLat = targetLatLng.lat - (window.innerWidth < 600 ? 60 : 20);
        map.flyTo([offsetLat, targetLatLng.lng], 0.7, { duration: 0.5 });
      }
    });

    map.on('click', () => {
      closeStationSheet();
    });

    // Floating Tools
    document.getElementById('btnResetView').addEventListener('click', () => {
      closeStationSheet();
      if (currentViewMode === 'map') {
        map.flyToBounds(boundsMap, { padding: [10, 10], duration: 0.5 });
      } else {
        map.flyToBounds(boundsBrochure, { padding: [10, 10], duration: 0.5 });
      }
    });

    document.getElementById('btnZoomIn').addEventListener('click', () => map.zoomIn(0.5));
    document.getElementById('btnZoomOut').addEventListener('click', () => map.zoomOut(0.5));

    // --- 7. Stations & Activities List Modal ---
    const stationsModalOverlay = document.getElementById('stationsModalOverlay');
    const btnOpenList = document.getElementById('btnOpenList');
    const btnCloseListModal = document.getElementById('btnCloseListModal');
    const stationsListContainer = document.getElementById('stationsListContainer');

    function renderStationsList() {
      stationsListContainer.innerHTML = '';

      // Section 1: Musical Stations
      const musicTitle = document.createElement('div');
      musicTitle.className = 'modal-section-title';
      musicTitle.innerHTML = '<span>🎵</span> תחנות מוסיקליות לאורך המסלול (6)';
      stationsListContainer.appendChild(musicTitle);

      STATIONS.forEach(station => {
        const row = document.createElement('div');
        row.className = 'station-list-row';
        const spotifyBadge = station.spotify 
          ? `<span class="tag-spotify-active">
              <svg viewBox="0 0 24 24"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.495 17.306c-.215.352-.676.463-1.028.247-2.817-1.722-6.363-2.112-10.54-1.157-.402.092-.801-.161-.893-.563-.092-.402.161-.801.563-.893 4.576-1.045 8.492-.596 11.65 1.338.353.216.464.676.248 1.028zm1.467-3.262c-.27.44-.847.578-1.287.308-3.225-1.982-8.14-2.557-11.954-1.399-.494.15-1.02-.133-1.17-.627-.15-.494.133-1.02.627-1.17 4.364-1.324 9.791-.685 13.476 1.58.44.27.578.847.308 1.288zm.126-3.41c-3.868-2.296-10.248-2.508-13.941-1.387-.593.18-1.223-.155-1.403-.748-.18-.593.155-1.223.748-1.403 4.25-1.29 11.295-1.039 15.753 1.608.533.316.708 1.008.392 1.541-.316.533-1.008.708-1.549.39z"/></svg>
              Spotify
            </span>` 
          : '';

        row.innerHTML = `
          <div class="station-item-main">
            <h4>${station.name}</h4>
            <p>👥 ${station.lineup}</p>
            <p style="margin-top:2px; font-size:11px; color:#9ca3af;">📍 ${station.location}</p>
          </div>
          <div class="tags-container">
            ${spotifyBadge}
            <span class="tag-yt-active">▶ YouTube</span>
          </div>
        `;
        row.addEventListener('click', () => {
          stationsModalOverlay.classList.remove('open');
          if (currentViewMode !== 'map') {
            switchToMap();
          }
          setTimeout(() => {
            openStationSheet(station);
          }, 200);
        });
        stationsListContainer.appendChild(row);
      });

      // Section 2: Green Environmental Points
      const greenTitle = document.createElement('div');
      greenTitle.className = 'modal-section-title';
      greenTitle.innerHTML = '<span>🌿</span> פעילויות סביבתיות - נקודות ירוקות (3)';
      stationsListContainer.appendChild(greenTitle);

      GREEN_POINTS.forEach(point => {
        const row = document.createElement('div');
        row.className = 'station-list-row';
        row.innerHTML = `
          <div class="station-item-main">
            <h4>${point.name}</h4>
            <p>🏛️ ${point.org}</p>
            <p style="margin-top:2px; font-size:11px; color:#9ca3af;">📍 ${point.location}</p>
          </div>
          <div class="tags-container">
            <span class="tag-green-active">🌿 אתר ארגון</span>
          </div>
        `;
        row.addEventListener('click', () => {
          stationsModalOverlay.classList.remove('open');
          if (currentViewMode !== 'map') {
            switchToMap();
          }
          setTimeout(() => {
            openGreenSheet(point);
          }, 200);
        });
        stationsListContainer.appendChild(row);
      });
    }

    btnOpenList.addEventListener('click', () => {
      renderStationsList();
      stationsModalOverlay.classList.add('open');
    });

    btnCloseListModal.addEventListener('click', () => {
      stationsModalOverlay.classList.remove('open');
    });

    stationsModalOverlay.addEventListener('click', (e) => {
      if (e.target === stationsModalOverlay) {
        stationsModalOverlay.classList.remove('open');
      }
    });
  </script>
